<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&display=swap">
<style>
  :root {
    --panel: #3a3f44;         /* painted instrument panel */
    --panel-edge: #2c3034;
    --face: #000000;          /* gauge faces */
    --marking: #ecede8;       /* gauge markings and panel text */
    --dim: #a9aeb2;
    --bug: #d23cc8;           /* autopilot / target bugs, aviation magenta */
    --sky: #9cc3e4;
    --font: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--panel);
    color: var(--marking);
    font: 500 16px/1.35 var(--font);
    display: grid;
    grid-template-rows: auto minmax(220px, 1fr) auto;
    height: 100dvh;
    overflow: hidden;
  }

  /* Playback bar */
  #bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 8px 16px; background: var(--panel-edge);
  }
  #bar label { color: var(--dim); }
  select, button, input {
    font: inherit; color: var(--marking); background: var(--panel);
    border: 1px solid #5b6167; border-radius: 4px; padding: 4px 10px; min-height: 32px;
  }
  input[type="number"] { width: 5.5em; }
  button { cursor: pointer; }
  button:hover { background: #474d53; }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--bug); outline-offset: 2px; }
  #source { max-width: 22em; }
  #progress { flex: 1 1 200px; display: flex; align-items: center; gap: 10px; min-width: 180px; }
  #progress-track { flex: 1; height: 4px; background: #5b6167; border-radius: 2px; overflow: hidden; }
  #progress-fill { height: 100%; width: 0; background: var(--marking); }
  #clock { font-variant-numeric: tabular-nums; color: var(--dim); white-space: nowrap; }

  /* 3D view */
  #view { position: relative; background: var(--sky); min-height: 0; }
  #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #message {
    position: absolute; left: 16px; bottom: 16px; max-width: 34em;
    padding: 8px 12px; border-radius: 4px; background: rgba(44, 48, 52, .86);
  }
  #message:empty { display: none; }
  #hint { position: absolute; right: 16px; bottom: 12px; color: #2c3034; font-size: 14px; }

  /* Instrument panel */
  #panel {
    display: grid; gap: 12px 18px; padding: 12px 16px 14px;
    grid-template-columns: repeat(3, var(--g)) auto var(--g);
    grid-template-rows: repeat(2, var(--g));
    --g: min(17vh, 150px);
    justify-content: center; align-items: center;
    border-top: 3px solid var(--panel-edge);
  }
  .gauge { width: var(--g); height: var(--g); display: block; }
  #tach { grid-column: 5; grid-row: 1; }
  #controls { grid-column: 5; grid-row: 2; }
  #readout {
    grid-column: 4; grid-row: 1 / span 2; align-self: stretch;
    display: flex; flex-direction: column; justify-content: center; gap: 6px;
    min-width: 11em; padding: 0 6px; font-variant-numeric: tabular-nums;
  }
  #readout dl { margin: 0; display: grid; grid-template-columns: auto auto; gap: 2px 12px; }
  #readout dt { color: var(--dim); }
  #readout dd { margin: 0; text-align: right; }
  #readout .target { color: var(--bug); }
  #run { color: var(--dim); font-size: 14px; word-break: break-all; }

  @media (max-width: 760px) {
    body { height: auto; min-height: 100dvh; overflow: auto; grid-template-rows: auto 45vh auto; }
    #panel { --g: min(28vw, 120px); grid-template-columns: repeat(3, var(--g)); grid-template-rows: none; }
    #tach, #controls { grid-column: auto; grid-row: auto; }
    #readout { grid-column: 1 / -1; grid-row: auto; order: 1; }
    #hint { display: none; }
  }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
  <div id="bar" role="toolbar" aria-label="Playback">
    <label for="source">Flight</label>
    <select id="source"></select>
    <label for="seed" id="seed-label">Seed</label>
    <input id="seed" type="number" min="0" step="1" value="0">
    <button id="play">Play</button>
    <button id="pause" disabled>Pause</button>
    <button id="stop" disabled>Stop</button>
    <label for="speed">Speed</label>
    <select id="speed">
      <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option>
      <option value="5">5×</option><option value="10">10×</option><option value="30">30×</option>
    </select>
    <div id="progress"><div id="progress-track"><div id="progress-fill"></div></div><span id="clock">0:00</span></div>
  </div>

  <main id="view">
    <div id="message" role="status" aria-live="polite"></div>
    <div id="hint">Drag to look around, scroll to zoom, space to pause</div>
  </main>

  <section id="panel" aria-label="Instruments">
    <canvas class="gauge" id="asi" aria-label="Airspeed"></canvas>
    <canvas class="gauge" id="ai" aria-label="Attitude"></canvas>
    <canvas class="gauge" id="alt" aria-label="Altimeter"></canvas>
    <canvas class="gauge" id="tc" aria-label="Turn coordinator"></canvas>
    <canvas class="gauge" id="hi" aria-label="Heading"></canvas>
    <canvas class="gauge" id="vsi" aria-label="Vertical speed"></canvas>
    <canvas class="gauge" id="tach" aria-label="Engine RPM"></canvas>
    <canvas class="gauge" id="controls" aria-label="Control positions"></canvas>
    <div id="readout">
      <dl>
        <dt>Altitude</dt><dd id="r-alt">–</dd>
        <dt>Altitude target</dt><dd id="r-talt" class="target">–</dd>
        <dt>Heading</dt><dd id="r-hdg">–</dd>
        <dt>Heading target</dt><dd id="r-thdg" class="target">–</dd>
        <dt>Airspeed</dt><dd id="r-kias">–</dd>
        <dt>Angle of attack</dt><dd id="r-aoa">–</dd>
        <dt>Load factor</dt><dd id="r-g">–</dd>
      </dl>
      <div id="run"></div>
    </div>
  </section>

  <script type="module" src="./app.js"></script>
</body>
</html>
