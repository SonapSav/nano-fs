[project]
name = "flightsim"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "gymnasium>=1.3.0",
    "jsbsim==1.3.1",
    "numpy>=2.5.3",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "websockets>=17.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
