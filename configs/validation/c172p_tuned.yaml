# Validation of the tuned copy (flightsim/aircraft/c172p_tuned): the same checks and
# references as c172p.yaml; only the aircraft and the known deviations differ.
# Tuned (2026-10-06): propeller power and thrust coefficients at low advance ratio, main
# gear tyre friction (see the comments in the aircraft and propeller files).
base: c172p.yaml
aircraft: c172p_tuned

ground:
  static_rpm:
    known_deviation: null      # 2380 RPM, within 2300-2420
  climb:
    known_deviation: null      # 733 fpm at 2634 RPM, within the redline
  landing:
    known_deviation: null      # 538 ft
  takeoff:
    known_deviation: null      # 894 ft at a 55.1 KCAS lift-off (propeller thrust at low advance ratio tuned 2026-10-10)
    acceleration_known_deviation: null
    liftoff_known_deviation: null

# Tuned 2026-10-10: wing lift near the stall (+10 % at the peak) and elevator effectiveness
# (-1.28), so the stall speeds match the POH (aft CG: aerodynamic; forward CG: the
# elevator now reaches the stall). Same points as c172p.yaml, without its deviations.
stall:
  points:
    - {cg: aft, flaps_deg: 0, kcas: 51}
    - {cg: aft, flaps_deg: 10, kcas: 48}
    - {cg: aft, flaps_deg: 30, kcas: 46}
    - {cg: forward, flaps_deg: 0, kcas: 52}
    - {cg: forward, flaps_deg: 10, kcas: 49}
    - {cg: forward, flaps_deg: 30, kcas: 46}
