# Abu Dhabi around Al Bateen Executive Airport (OMAD), the first real-world region
# (decided 2026-10-09, CLAUDE.md Decisions). Build: uv run --group scenery python
# scripts/build_scenery.py configs/scenery/abu_dhabi.yaml (into data/scenery/abu_dhabi/).
name: abu_dhabi

# Map origin: the midpoint of runway 13/31's full length (pavement ends, OSM ways
# 515697943 and 515697946 in the Geofabrik extract below). Those ends are 3202.1 m apart on
# the map; published 3202 x 45 m (Wikipedia "Al Bateen Executive Airport", SkyVector OMAD,
# retrieved 2026-10-09). OSM's 13/31 way (2200 m) is the runway between the displaced
# thresholds.
origin_airport: OMAD   # named by the GPS at the origin
origin_lat_deg: 24.4284648
origin_lon_deg: 54.4580337

# 4 km tiles from -13 to 12 east and south of the origin: 104 x 104 km.
tiles_radius: 13

sources:
  dem:
    # FABDEM V1-2 (Hawker et al. 2022, University of Bristol, doi 10.5523/bris.s5hqmjcdj8yo2ibzi9b4ew3sn):
    # Copernicus GLO-30 with buildings and trees removed; non-commercial licence.
    zip_url: https://data.bris.ac.uk/datasets/s5hqmjcdj8yo2ibzi9b4ew3sn/N20E050-N30E060_FABDEM_V1-2.zip
  landcover:
    # ESA WorldCover 10 m 2021 v200 (CC BY 4.0), AWS open data.
    url: https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_{tile}_Map.tif
  osm:
    # Geofabrik's dated extract of the GCC states (OpenStreetMap, ODbL), pinned by date.
    url: https://download.geofabrik.de/asia/gcc-states-261008.osm.pbf
  imagery:
    # Sentinel-2 L2A surface reflectance, red/green/blue bands (B04, B03, B02; 10 m), AWS Earth
    # Search (collection sentinel-2-l2a; reflectance = value x 0.0001 - 0.1 per the items'
    # raster:bands). Not the ready-made TCI: it clips 54 % of the desert at full white.
    # 24 October 2025, cloud 0.05-0.27 %: the morning pass of Sentinel-2A (relative orbit 63,
    # 07:13Z) and, for the east edge it misses, Sentinel-2B's 10 minutes earlier (orbit 20).
    # Copernicus Sentinel data: free and open. Only each scene's window over the region is
    # downloaded (sources/<id>_window.tif). First listed wins where scenes overlap.
    bands: [B04, B03, B02]
    # Water WorldCover maps as land (tidal flats, new shores; near the city it showed the
    # imagery's black water without the water shading, and the physics flew over it as
    # ground): Sentinel-2's water index NDWI = (B03 - B08) / (B03 + B08) of the same scenes,
    # water at sea level only (world/scenery_build.py build_water; thresholds project
    # choices, the owner's decision 2026-10-11).
    water_index: {ndwi_min: 0.1, max_height_m: 1.0}
    scale: 0.0001
    offset: -0.1
    # Our brightness curve: 255 x (gain x reflectance)^(1/gamma), gain per band (red, green,
    # blue), balanced so the desert's median comes out as the land cover style's sand
    # (216, 194, 155): project choice, by eye. A single gain of 2.2 left it dark and warm
    # (194, 157, 117).
    gain: [2.62, 3.09, 3.44]
    gamma: 1.6
    items:
      - {id: S2A_39QYG_20251024_0_L2A, url: https://sentinel-cogs.s3.us-west-2.amazonaws.com/sentinel-s2-l2a-cogs/39/Q/YG/2025/10/S2A_39QYG_20251024_0_L2A/}
      - {id: S2A_39QZG_20251024_1_L2A, url: https://sentinel-cogs.s3.us-west-2.amazonaws.com/sentinel-s2-l2a-cogs/39/Q/ZG/2025/10/S2A_39QZG_20251024_1_L2A/}
      - {id: S2A_39RYH_20251024_0_L2A, url: https://sentinel-cogs.s3.us-west-2.amazonaws.com/sentinel-s2-l2a-cogs/39/R/YH/2025/10/S2A_39RYH_20251024_0_L2A/}
      - {id: S2A_39RZH_20251024_1_L2A, url: https://sentinel-cogs.s3.us-west-2.amazonaws.com/sentinel-s2-l2a-cogs/39/R/ZH/2025/10/S2A_39RZH_20251024_1_L2A/}
      - {id: S2B_39QZG_20251024_0_L2A, url: https://sentinel-cogs.s3.us-west-2.amazonaws.com/sentinel-s2-l2a-cogs/39/Q/ZG/2025/10/S2B_39QZG_20251024_0_L2A/}
      - {id: S2B_39RZH_20251024_0_L2A, url: https://sentinel-cogs.s3.us-west-2.amazonaws.com/sentinel-s2-l2a-cogs/39/R/ZH/2025/10/S2B_39RZH_20251024_0_L2A/}
  hires_imagery:
    # Satellogic EarthView (CC BY 4.0; registry.opendata.aws/satellogic-earthview, retrieved
    # 2026-10-10): 1 m true colour (VISUAL), 384 m tiles in UTM 40N (EPSG:32640), one per
    # satellite pass, August-November 2022. Within `radius_m` of the origin (a square), over the
    # Sentinel imagery (world/scenery_hires.py). About 12,000 tiles, 4.9 GB.
    bucket: https://satellogic-earthview.s3.us-west-2.amazonaws.com
    zone: 40N
    epsg: 32640
    radius_m: 25000
    # Pass order where passes overlap (first wins), project choice: afternoon passes first
    # (sun azimuth 213-251 deg, the side the viewer's afternoon sun lights), each group by its
    # view angle off nadir (less building lean), from one tile's metadata per pass; the three
    # morning passes (sun 121-150 deg, shadows the other way) last.
    passes:
      - 20220905_SN20   # off nadir 1.8 deg, sun elevation 48
      - 20220909_SN28   # 2.0, 62
      - 20221118_SN20   # 6.8, 29
      - 20221025_SN28   # 12.2, 46
      - 20220919_SN30   # 16.5, 58
      - 20221021_SN22   # 17.0, 34
      - 20221024_SN22   # 17.8, 33
      - 20220912_SN29   # 18.5, 59
      - 20221119_SN29   # 22.6, 39
      - 20220902_SN25   # morning: 4.1, 70
      - 20220831_SN9    # 7.0, 62
      - 20221023_SN9    # 18.0, 50
    # Colour matching to the Sentinel imagery (project choices): the smooth gain's blur and
    # the feathering of the covered area's edge.
    match_blur_m: 60
    feather_m: 60
  building_height:
    # GHS-BUILT-H R2023A, average net building height 2018, 100 m (Pesaresi & Politis 2023,
    # European Commission JRC, doi 10.2905/85005901-3A49-48DD-9D19-6261354F56FE; CC BY 4.0;
    # AWS Open Data jrc-ghsl): only the region's window is read. Replaces the type guess for
    # buildings OpenStreetMap gives no height or floors (houses and villas at most 12 m).
    url: https://jrc-ghsl.s3.eu-central-1.amazonaws.com/ghs-built-h-anbh/r2023a/54009/100m/2018/GHS_BUILT_H_ANBH_E2018_GLOBE_R2023A_54009_100_V1_0.tif
    small_kinds_max_m: 12
  gba_heights:
    # GlobalBuildingAtlas (Zhu et al. 2025, Technical University of Munich; github.com/zhu-xlab/
    # GlobalBuildingAtlas, retrieved 2026-10-11): building heights per footprint, machine
    # learned from 2019 PlanetScope imagery; heights (GBA.LoD1) and the non-OSM footprints
    # CC BY-NC 4.0, OSM-derived footprints ODbL. Tile e050_n25_e055_n20 (filed under
    # "africa"). For buildings without an OSM height or levels tag, replacing GHS-BUILT-H's
    # 100 m cell averages: against OSM's levels here (3,929 buildings) 50 % within 3 m, mean
    # error 5.8 m, correlation 0.75 (GHS: 33 %, 8.1 m, 0.57); 2.0 m low (median), corrected
    # by `bias_m`; some structures at 0.5 m, so `min_m`. Towers are far too low in both
    # (OSM's own heights cover them). The key per footprint: source + id + region.
    files:
      - {name: gba_lod1_e050_n25_e055_n20.json, url: "https://huggingface.co/datasets/zhu-xlab/GBA.LoD1/resolve/main/LoD1/africa/e050_n25_e055_n20.json"}
      - {name: gba_polygon_e050_n25_e055_n20.geojson, url: "https://huggingface.co/datasets/zhu-xlab/GBA.LoD1/resolve/main/Polygon/africa/e050_n25_e055_n20.geojson"}
      - {name: gba_odbl_polygon_e050_n25_e055_n20.geojson, url: "https://huggingface.co/datasets/zhu-xlab/GBA.ODbLPolygon/resolve/main/africa/e050_n25_e055_n20.geojson"}
    bias_m: 2.0
    min_m: 3.0
  canopy_height:
    # Meta and World Resources Institute (WRI) 2024, global canopy height map (Tolan et al.
    # 2024, Remote Sensing of Environment 300, 113888): canopy height in whole metres at
    # ~1.2 m (EPSG:3857), from Maxar imagery (mostly 2018-2020) trained on aerial lidar; CC BY
    # 4.0, AWS Open Data dataforgood-fb-data (registry.opendata.aws/dataforgood-fb-forests,
    # retrieved 2026-10-11). Tiles over the region from tiles.geojson. Checked on the 1 m
    # imagery at the Grand Mosque: lawns and gardens 0 m, groves and car-park tree rows
    # found; misses some smaller palms (younger than its imagery). Trees: local maxima of at
    # least `min_tree_m`, `spacing_m` apart (world/scenery_trees.py).
    url: "https://dataforgood-fb-data.s3.us-east-1.amazonaws.com/forests/v1/alsgedi_global_v6_float/chm/{tile}.tif"
    tiles: ["123023122", "123023123", "123023132", "123023300", "123023301", "123023310"]
    min_tree_m: 3
    spacing_m: 2.5
  # Credits shown with the scenery (the viewer's corners; full text as their tooltip and in
  # the README). EarthView's: the registry's citation (accessed on DATE from its page),
  # 2026-10-10. Wording checked 2026-10-09: FABDEM's required Copernicus statement (Earth
  # Engine community catalogue, FABDEM); WorldCover's attribution (Planet public data
  # docs); OpenStreetMap's notice and licence (openstreetmap.org/copyright).
  credit_short: "© OpenStreetMap contributors (ODbL) · ESA WorldCover 2021 · FABDEM (Copernicus WorldDEM-30) · Contains modified Copernicus Sentinel data 2025 · Satellogic EarthView (CC BY 4.0) · GlobalBuildingAtlas (CC BY-NC 4.0) · Canopy height: Meta and WRI 2024 (CC BY 4.0), imagery © 2016 Maxar"
  credits:
    - "FABDEM V1-2 (Hawker et al. 2022, A 30m global map of elevation with forests and buildings removed, Environmental Research Letters; University of Bristol), CC BY-NC-SA 4.0. FABDEM is produced using Copernicus WorldDEM-30 © DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved. The organizations in charge of the Copernicus program by law or by delegation do not incur any liability for any use of the Copernicus WorldDEM-30."
    - "© ESA WorldCover project 2021 / Contains modified Copernicus Sentinel data (2021) processed by ESA WorldCover consortium (CC BY 4.0)."
    - "© OpenStreetMap contributors. The data is available under the Open Database License (ODbL)."
    - "Contains modified Copernicus Sentinel data 2025 (Sentinel-2 L2A, 24 October 2025)."
    - "GHS-BUILT-H R2023A (building heights), European Commission, Joint Research Centre (CC BY 4.0)."
    - "GlobalBuildingAtlas (building heights), Zhu et al. 2025, Technical University of Munich, CC BY-NC 4.0."
    - "Trees: Meta and World Resources Institute (WRI) 2024, high resolution canopy height maps, CC BY 4.0. Source imagery for CHM © 2016 Maxar."
    - "Satellogic EarthView (1 m imagery, 2022), Satellogic, CC BY 4.0; accessed on 2026-10-10 from https://registry.opendata.aws/satellogic-earthview. Modified: resampled, colour-matched to the Sentinel-2 imagery and blended into it."

# Landmarks modelled in the viewer (viewer/landmarks.js) on their OSM footprints; `replace`
# drops OSM's plain box there. Dimensions from Wikipedia (retrieved 2026-10-09) unless
# marked "project choice" (no source gave them).
landmarks:
  # Sheikh Zayed Grand Mosque. Official site (szgmc.gov.ae, retrieved 2026-10-10): 82 domes,
  # the largest about 32.6 m across and 84 m high, white marble cladding, onion-shaped
  # crowns and crescent finials in gold-glass mosaic; four minarets about 107 m at the
  # corners of the courtyard, of square, octagonal and circular layers with balconies and
  # gilding (Wikipedia: 104 m in the infobox). `parts`: the other domes (positions, sizes,
  # heights) and the reflecting pools come from OSM's building:part / natural=water areas;
  # the roof at OSM's height tag on the mosque (33 m).
  # Layout (2026-10-10): measured on a reference 3D model fitted to OSM's courtyard (its four
  # minarets on the courtyard's corners, 1.4 m rms; its main dome 3.8 m from OSM's) and
  # checked against the 1 m imagery; heights from the model where no source gives them
  # (it agrees with the published ones: main dome 85.4 m, hall roof with parapet 32.9 m;
  # its minarets were 16 % too tall, so their tiers are fractions of the published 107 m).
  # Muslim Heritage (muslimheritage.com, "Sheikh Zayed Great Mosque in Abu Dhabi"): three
  # egg-shaped domes on the prayer hall with eight small cupolas around each, some 34
  # small domes on the courtyard's galleries, roof 33 m, a platform raised above the
  # ground. Coordinates (u, v) in metres from the courtyard's centre: u along its long
  # axis (the layout is symmetric in u), v across toward the prayer hall. OSM's dome tops
  # (43 m for the gallery domes, 65 m for the side domes) disagree with the model and are
  # not used; the main dome's diameter is OSM's and the model's 37.5 m (the published
  # 32.6-32.8 m is likely the inner shell).
  - {name: Sheikh Zayed Grand Mosque, kind: grand_mosque, osm: relation/1635169, replace: true, parts: true,
     dome_top_m: 85, dome_diameter_m: 37.5, minaret_m: 107, roof_m: 33,
     layout: {
       podium: {u: 112, v: [-88, 173], top_m: 2.0},
       gallery_roof_m: 16.9,
       blocks: [  # [u half-width or [u0, u1], [v0, v1], roof m]: symmetric in u when one number
         [74, [96, 153], 31.2],        # prayer hall (parapet to 32.9)
         [71.5, [58.5, 97.5], 21.0],   # portico between courtyard and hall
         [34, [-82, -57], 22.7],       # east gate
         [[70, 95], [-83, -58.5], 26.6],  # east corner pavilions
         [[73, 94], [111, 134], 27.3],    # west corner pavilions
         [[19, 27], [57, 66], 26.2],      # pavilions flanking the portico dome
         [16.3, [150.5, 171.5], 27.3],    # qibla bay
         [[8, 39], [145.5, 156], 24.3]],  # beside the qibla bay
       domes: [  # [u, v, kind]; mirrored in u when u > 0 ("m")
         [0, 122.8, main], [52, 123, side, m], [0, 78.2, portico], [0, 156.2, qibla], [0, -69.2, gate],
         [33.4, 89, portico_cupola, m], [65.5, 88.5, portico_cupola, m], [83.7, 123, hall_end, m]],
       gallery_domes: {u: 79.75, v: [-53.25, -35.6, -17.8, 0, 17.3, 35, 52.5, 70, 88, 105.5],
                       east_v: -70, east_u: [46.5, 64.5], hall_v: 70.2, hall_u: [29, 46.5, 64.5]},
       kinds: {  # r: dome radius, drum: [radius, sides], spring/apex/top: m above ground; ring: cupolas [count, radius from centre]
         main: {r: 18.3, drum: [19.5, 16], spring: 47, apex: 82, top: 85, ring: [8, 22], shape: egg},
         side: {r: 15.0, drum: [16.0, 16], spring: 45, apex: 72, top: 75, ring: [8, 18], shape: egg},
         cupola_main: {r: 3.0, drum: [4.4, 8], spring: 39.5, apex: 45.5, top: 47},
         cupola_side: {r: 2.6, drum: [3.6, 8], spring: 37.5, apex: 42, top: 43},
         portico: {r: 8.8, drum: [9.2, 8], spring: 38.5, apex: 46, top: 47},
         portico_cupola: {r: 3.4, drum: [5.3, 8], spring: 39, apex: 43.5, top: 44.7},
         qibla: {r: 7.0, drum: [7.2, 8], spring: 39.5, apex: 46, top: 47.5},
         gate: {r: 7.3, drum: [7.7, 8], spring: 35.5, apex: 40.5, top: 44.3},
         hall_end: {r: 5.0, drum: [5.4, 8], spring: 37.5, apex: 40.5, top: 41},
         gallery: {r: 4.2, drum: [3.5, 4], spring: 24.7, apex: 28.3, top: 29}},
       minaret: [  # [from, to (fractions of the height), shape (sides), radius m (centre to corner)]: the model's tiers
         [0, 0.415, 4, 8.7], [0.205, 0.215, 4, 9.6], [0.415, 0.44, 8, 6.0], [0.44, 0.565, 8, 4.75],
         [0.565, 0.605, 8, [4.9, 6.8]], [0.605, 0.615, 16, 6.8], [0.615, 0.775, 16, 2.53], [0.775, 0.795, 16, [2.6, 3.8]],
         [0.795, 0.805, 16, 3.8], [0.805, 0.88, 16, 1.67], [0.88, 0.895, 16, 2.5], [0.895, 0.95, 16, 0.71]]}}
  # Capital Gate: 160 m, 35 storeys, leaning 18 degrees west on average (Wikipedia); floors
  # stacked vertically up to the 12th storey, then staggered (Building, ME Construction
  # News); a diagrid of about 700 diamond-shaped glass panels; a stainless steel element
  # runs down the facade over the grandstand into the entrance canopy.
  # The splash heads for the grandstand roofs OSM maps west-north-west of the tower (ways
  # 397954265/6).
  - {name: Capital Gate, kind: leaning_tower, osm: way/103779658, replace: true, height_m: 160, lean_deg: 18,
     lean_toward_deg: 270, storeys: 35, vertical_storeys: 12, diagrid_panels: 700, splash_toward_deg: 294}
  # Louvre Abu Dhabi: a dome 180 m across on four piers 110 m apart (archeyes,
  # architecturelab), eight layers of 7,850 stars (four stainless steel outer, four
  # aluminium inner, on a 5 m steel frame; louvreabudhabi.ae), over 55 white buildings
  # (museum city). The dome's rim and rise from OSM's dome part (min_height, roof:height).
  - {name: Louvre Abu Dhabi, kind: flat_dome, osm: way/498046180, replace: true, parts: true, dome_diameter_m: 180,
     pier_spacing_m: 110, frame_m: 5, museum_buildings: 55}
  # Emirates Palace: a central dome 72.6 m high and 42 m across in silver and gold glass
  # mosaic, 114 domes in all, the smaller 7 to 12 m across (Visit Abu Dhabi; contractor
  # accounts); the colour of desert sand (Wikipedia). Other domes and their heights from
  # OSM's parts.
  - {name: Emirates Palace, kind: palace, osm: way/30394921, replace: true, parts: true, dome_diameter_m: 42,
     dome_top_m: 72.6, colour: sand, mosaic: true}
  # Qasr Al Watan (OSM "Al-Watan Palace"): a main dome 37 m across, 60 m high, over the
  # Great Hall at the centre of the building, white granite and limestone (Wikipedia, Gulf
  # News). Roof height: project choice (OSM's measured height, 5.3 m, is a 100 m cell's
  # average).
  - {name: Qasr Al Watan, kind: palace, osm: relation/7232861, replace: true, parts: true, dome_diameter_m: 37,
     dome_top_m: 60, colour: white, roof_m: 22}
  # Etihad Towers: five towers, 277.6, 305.3, 260.3, 234.0 and 217.5 m (Wikipedia; OSM's
  # height tags agree); glass curtain walls.
  - {name: Etihad Towers, kind: glass_towers, replace: true,
     osm: [way/168401784, way/168401785, way/168401781, way/168401783, way/168401782]}

# Bridges (viewer/bridges.js; the build: world/scenery_bridges.py). Every OSM road and
# railway bridge gets a deck: its ends on the roads at the ground, 1 m over land, 8 m of
# clearance over water (project choice), ramps of at most 5 %. These landmark bridges
# (OSM ways or name) set their own clearance, deck depth and structure. Sources
# retrieved 2026-10-10 (docs/REFERENCES.md); "project choice" where none gave a figure.
bridges:
  # Sheikh Zayed Bridge (Zaha Hadid, 2010): twin decks of 23.6 m between parapets (EAW),
  # 61 m overall (ZHA); the road crowns 20 m above mean water, the main arch 60 m (ZHA);
  # steel arches over the decks, 5-8 m deep boxes, prestressed concrete below the decks,
  # the arches fixed in mass concrete piers, "in profile a continuous flowing line"; arch
  # spans about 144 m (main channel), 74 m (secondary channel) and 50 m (marina) (EAW;
  # ENR). The arches' centres measured on the 1 m imagery (map x, z), the marina arch
  # outside the southern deck there; rib width, the side arches' tops, where the crowns
  # sit (from the west end), how far the ribs part, lamp posts: project choices (the
  # owner's photos, 2026-10-10).
  - {name: Sheikh Zayed Bridge, kind: wave_arch, ways: [91207495, 407685949], clearance_m: 17.5, deck_depth_m: 2.5,
     deck_width_m: 23.6, rib_width_m: 4, rib_depth_m: [8, 5], pier_low_m: 1.5, lamp_spacing_m: 25, lamp_height_m: 12,
     arches: [{centre_xz: [2757, 474], span_m: 144, top_m: 60, ribs_apart_m: 9, side: 0, crown_at: 0.38},
              {centre_xz: [2995, 513], span_m: 74, top_m: 40, ribs_apart_m: 6, side: 0.15, crown_at: 0.45},
              {centre_xz: [3160, 541], span_m: 50, top_m: 30, ribs_apart_m: 4, side: 1}]}
  # Al Maqta Bridge (1967, second arch 1997): about 300 m, steel tied (bowstring) arches,
  # one per direction (Wikipedia; Gulf News). Arch over the channel; its rise and the
  # clearance: project choices.
  - {name: Al Maqta Bridge, kind: tied_arch, ways: [24155984, 24155986], clearance_m: 6, deck_depth_m: 1.5, arch_rise_ratio: 0.18}
  # Mussafah Bridge (1976-78): 480 m, six lanes, prestressed concrete girder (Wikipedia,
  # Structurae). Clearance: project choice.
  - {name: Mussafah Bridge, kind: girder, ways: [24151136, 24151139], clearance_m: 8, deck_depth_m: 2.2}
  # Sheikh Khalifa Bridge (the Saadiyat Island bridge, 2009): 1,455 m, Al Mina to
  # Saadiyat, prestressed concrete box girders 3.5-10.25 m deep, spans to 200 m (main
  # unit 110-200-135-70-45 m) on V-piers, at most 35 m above ground (Strabag; Wikipedia).
  - {name: Sheikh Khalifa Bridge, kind: box_girder, osm_name: Sheikh Khalifa Bridge, clearance_m: 31.5, deck_depth_m: 3.5,
     main_spans_m: [110, 200, 135, 70, 45], girder_max_m: 10.25, v_pier_deg: 27.45}

# Published airfield data where OSM lacks or disagrees (OSM gives positions and numbers).
# Runways without a width here or in OSM get default_runway_width_m.
airports:
  OMAD:
    # Wikipedia "Al Bateen Executive Airport" (16 ft) and SkyVector OMAD (18 ft; runway
    # 3202 x 45 m asphalt), retrieved 2026-10-09.
    elevation_ft: 16
    runways:
      13/31: {length_m: 3202, width_m: 45}
default_runway_width_m: 30  # project choice for runways of unknown width

# sha256 of each source file, filled in after the first download (scripts/build_scenery.py
# --pin): a changed file stops the build.
pinned:
  ESA_WorldCover_10m_2021_v200_N21E051_Map.tif: ac6c6d6715859285d5c7cffadcd98f66ab3df6f8616ce38d1519b91438e8d1a9
  ESA_WorldCover_10m_2021_v200_N21E054_Map.tif: 4f98f9880a81c91dae336d0960f8ad947a6523ed2510ab523c2edca27e5181a6
