# Circuit with wind: the circuit plus the approach task's random low-altitude wind
# (as in approach_landing_crosswind.yaml).
base: circuit.yaml

approach:
  wind:
    u20_kt: [0, 20]             # wind at 20 ft, uniform
    max_crosswind_kt: 15        # C172P POH maximum demonstrated crosswind (Section 4)
    max_tailwind_kt: 0          # project choice: no tailwind takeoffs or landings
    turbulence: true
