# Step 3 task: capture and hold a target altitude and heading at the trim airspeed.
#
# Each episode: trim at a randomized cruise condition, then draw new targets offset
# from it. Randomness comes only from the seed passed to reset(seed=...).
aircraft: c172p
sim_rate_hz: 120
control_rate_hz: 20        # agent/autopilot decision rate; each action is held for 6 sim steps
episode_s: 120

initial_conditions:        # nominal; each episode adds a uniform draw within +/- randomize
  alt_msl_m: 1524          # 5000 ft
  tas_mps: 51.44           # 100 kt
  heading_deg: 90
randomize:
  alt_msl_m: 300
  tas_mps: 5
  heading_deg: 180

targets:                   # uniform offsets from the initial condition, +/-
  alt_offset_m: 150
  heading_offset_deg: 120  # target airspeed is always the trim airspeed

loading:
  pointmasses_kg: [81.65, 0, 0, 0, 0]
  fuel_tanks_kg: [45.36, 45.36]

reward:                    # per decision step: -(sum of w * min((error/scale)^2, clip))
  alt_scale_m: 50
  heading_scale_deg: 30
  tas_scale_mps: 5
  w_alt: 1.0
  w_heading: 1.0
  w_tas: 0.2
  w_action_rate: 0.1       # on the change in action between decision steps
  clip: 4.0
  termination_penalty: 100.0

termination:               # end the episode (with penalty) outside the safe envelope
  max_alt_error_m: 500
  max_bank_deg: 75
  max_alpha_deg: 14        # model CLmax is at 16 deg
  min_alt_agl_m: 100
