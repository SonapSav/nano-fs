# Free flight over Abu Dhabi: free.yaml from Apron A at Al Bateen (OMAD), where the owner
# put the belly camera's cross hairs (2026-10-15: N 24 26.140 E 054 26.613), on the
# helicopter taxi lane between helipads A3-A7 of Falcon Aviation's apron, nose south-east
# towards the exit to the H13/H31 strip (heading: project choice). To runway 31's start:
# H13/H31, taxiway T south-east (about 2.5 km), taxiway 6.
base: free.yaml
world:                       # Abu Dhabi (configs/scenery/abu_dhabi.yaml; see abu_dhabi.yaml)
  geodesy: wgs84
  origin_lat_deg: 24.4284648
  origin_lon_deg: 54.4580337
  scenery: abu_dhabi
terrain: dem

free:
  start: {lat_deg: 24.4356667, lon_deg: 54.4435500, heading_deg: 105}

# A summer day at Abu Dhabi: Zayed International Airport's July mean daily maximum (42.5 C,
# 1991-2020 normals, NCM via Wikipedia "Abu Dhabi") and a typical July sea-level pressure
# (994-997 hPa observed July 2024, Met Office; 996). Density altitude near sea level ~3700 ft.
atmosphere:
  sea_level_temperature_c: 42.5
  sea_level_pressure_hpa: 996
