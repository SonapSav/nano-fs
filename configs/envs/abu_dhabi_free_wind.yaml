# Free flight over Abu Dhabi in wind: abu_dhabi_free.yaml plus free_wind.yaml's wind.
base: abu_dhabi_free.yaml

free:
  wind:
    u20_kt: [0, 20]
    max_crosswind_kt: 15        # against the stand's heading: C172P POH maximum demonstrated crosswind
    max_tailwind_kt: 0          # parked in a tailwind, JSBSim tips the aircraft onto its tail (envs/free.py)
    turbulence: true
