# PPO on the comfort task (configs/envs/altitude_heading_hold_comfort.yaml).
# Training episodes come from seeded environment RNG streams (training_seed + env index),
# not from the evaluation seed ranges (0-2999). Periodic evaluation uses tuning seeds.
env_config: ../envs/altitude_heading_hold_comfort.yaml
seed: 0                         # torch / SB3 / environment streams
n_envs: 6                       # one per physical core
total_timesteps: 50000000       # upper bound; the wall-clock limit normally stops training first
wall_clock_limit_min: 90

ppo:
  learning_rate: 3.0e-4
  n_steps: 1024                 # per environment; 6144 decisions (5 min of flight) per update
  batch_size: 1024
  n_epochs: 10
  gamma: 0.995                  # ~10 s horizon at 20 Hz decisions
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  max_grad_norm: 0.5
  net_arch: [64, 64]            # separate policy and value networks of this size
  log_std_init: -1.0            # initial exploration std 0.37 (actions are absolute commands in [-1, 1])

normalize:
  observations: true
  rewards: true
  clip_observations: 10.0
  clip_rewards: 10.0

evaluation:
  every_timesteps: 1000000
  seeds: [1000, 1020]           # start:stop, tuning range (held-out ranges 0-999 and 2000-2999 untouched)

checkpoint_every_timesteps: 5000000
