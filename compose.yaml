x-flightsim: &flightsim
  build:
    context: .
    args:                       # set by scripts/docker.py; empty with plain docker compose
      GIT_COMMIT: ${FLIGHTSIM_GIT_COMMIT:-}
      GIT_DIRTY: ${FLIGHTSIM_GIT_DIRTY:-}
      GIT_DIFF_SHA256: ${FLIGHTSIM_GIT_DIFF_SHA256:-}
  image: flightsim:dev
  # Run as the host user so logs written to ./data are not root-owned.
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - ./data:/app/data

services:
  sim:
    <<: *flightsim

  viewer:
    <<: *flightsim
    command: ["python", "-m", "flightsim.stream", "--host", "0.0.0.0", "--port", "8686", "--data-dir", "data"]
    ports:
      - "8686:8686"
